<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>DeepSeek Harness</h1>
    <p class="sub">连接到你自己的 dsh web 服务器</p>
    <form id="setup">
      <label for="url">服务器地址</label>
      <input id="url" name="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
        placeholder="https://your-server.example 或 http://100.64.0.1:3080" required>
      <p id="error" class="error" hidden>请输入以 http:// 或 https:// 开头的地址</p>
      <button type="submit">保存并连接</button>
    </form>
    <p class="hint">地址保存在本机，仅用于连接你自己的服务器。
      如需更换服务器，请在系统设置中清除本应用的数据后重新打开。</p>
  </main>
  <script src="validate.js"></script>
  <script src="app.js"></script>
</body>
</html>
